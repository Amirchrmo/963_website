services:
  nginx:
    image: nginx:1.27-alpine
    container_name: runningclub-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 64m
    networks:
      - proxy-net

# proxy-net is created by /opt/infra (edge).
networks:
  proxy-net:
    external: true
