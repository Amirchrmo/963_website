server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Service worker must never be cached, and is allowed to control "/".
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
        default_type application/javascript;
        try_files $uri =404;
    }

    # PWA manifest — correct content type.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Next.js hashed static assets (JS/CSS chunks, build media) — immutable.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Locally hosted fonts — immutable long cache.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA icons — immutable long cache.
    location /icons/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pre-built optimized images — immutable long cache.
    location /images/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static pages (trailing-slash export -> /route/index.html)
    # with SPA fallback for client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
